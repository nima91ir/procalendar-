name: Deploy Flutter Web to GitHub Pages

# MANUAL ONLY. This workflow used to run on every push to `main`, which meant a
# routine commit could replace the live site with no rollback. Publishing is now
# a deliberate action: Actions tab -> "Deploy Flutter Web to GitHub Pages" ->
# Run workflow (or `gh workflow run "Deploy Flutter Web to GitHub Pages"`).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fitness_trainer_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # Tests gate publishing: the full suite must be green before the live site
      # is replaced. Deliberately number-free — this said "177" and rotted.
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --release --base-href /procalendar-/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: fitness_trainer_app/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
